services:
  - type: web
    name: constructaiq-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_HOURS
        value: 24
      - key: REPORT_EMAIL_ENABLED
        value: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: AZURE_COMMUNICATION_CONNECTION_STRING
        sync: false
      - key: AZURE_COMMUNICATION_EMAIL_FROM
        sync: false
    healthCheckPath: /healthz
